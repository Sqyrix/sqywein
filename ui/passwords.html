<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Şifreler</title><link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body><main class="main" id="main" tabindex="-1"><div class="content passwords-page">
<h1>Şifreler</h1><p class="subtitle">Hesapların, bu cihazda güvenle saklanır.</p>
<div class="toolbar"><label class="search"><span class="sr-only">Şifrelerde ara</span><input id="search" type="search" placeholder="Site veya kullanıcı adı ara" autocomplete="off"></label><button id="import-open" type="button">Google'dan içe aktar</button><button id="export" type="button">Dışa aktar</button></div>
<section id="import-card" class="card" hidden aria-labelledby="import-heading"><h2 id="import-heading">Google'dan şifrelerini getir</h2><ol class="password-steps"><li>Google Şifre Yöneticisi'ni aç. <button type="button" id="google-open">Google'ı aç</button></li><li>“Şifreleri dışa aktar” seçeneğini kullan.</li><li><label for="csv-file">İndirdiğin CSV dosyasını seç.</label> <input id="csv-file" type="file" accept=".csv,text/csv"></li></ol><p id="import-status" class="detail" role="status" aria-live="polite"></p><button id="import-close" type="button" class="quiet">Kapat</button></section>
<div class="page-actions"><button id="add-open" type="button">Şifre ekle</button></div>
<section id="add-card" class="card" hidden aria-labelledby="add-heading"><h2 id="add-heading">Şifre ekle</h2><form id="add-form" class="password-form"><label>Site adresi<input name="url" type="url" placeholder="https://example.com" required></label><label>Kullanıcı adı<input name="username" type="text" autocomplete="off"></label><label>Şifre<input name="password" type="password" autocomplete="new-password" required></label><div class="actions"><button type="submit" class="primary">Kaydet</button><button type="button" id="add-cancel">Vazgeç</button></div></form></section>
<div id="results" aria-busy="true"><p class="loading" role="status">Şifreler yükleniyor…</p></div>
</div></main><script>
'use strict';
initPage('passwords');
if(location.hash==='#import')setTimeout(() => document.getElementById('import-open').click(),0);
if(location.hash==='#export')setTimeout(() => document.getElementById('export').click(),0);
const results=document.getElementById('results'),search=document.getElementById('search');
const importCard=document.getElementById('import-card'),addCard=document.getElementById('add-card');
let items=[];
const requests=new Map();
function openImport(){importCard.hidden=false;document.getElementById('google-open').focus();}
document.getElementById('import-open').addEventListener('click',openImport);
document.getElementById('import-close').addEventListener('click',() => {importCard.hidden=true;document.getElementById('import-open').focus();});
document.getElementById('google-open').addEventListener('click',() => send('open',{url:'https://passwords.google.com/options',newTab:true}));
document.getElementById('csv-file').addEventListener('change',event => {
  const file=event.target.files[0];if(!file)return;
  const status=document.getElementById('import-status');status.textContent='Dosya okunuyor…';
  const reader=new FileReader();reader.onload=() => {status.textContent='Şifreler içe aktarılıyor…';send('passwords.import',{csv:String(reader.result)});event.target.value='';};
  reader.onerror=() => {status.textContent='Dosya okunamadı. Dosyayı yeniden seç.';event.target.value='';};reader.readAsText(file,'UTF-8');
});
on('passwords.import',message => {
  const summary=`${message.added || 0} eklendi, ${message.updated || 0} güncellendi, ${message.skipped || 0} atlandı.`;
  document.getElementById('import-status').textContent=summary+' İçe aktarma bitti. Güvenliğin için indirdiğin CSV dosyasını silmeyi unutma.';notify(summary);send('passwords.list',{query:search.value});
});
document.getElementById('export').addEventListener('click',event => confirmInline(event.currentTarget,'Dışa aktarılan dosyada şifreler açık metin olarak durur.',() => send('passwords.export')));
on('passwords.export',message => {if(typeof message.csv!=='string')return;const url=URL.createObjectURL(new Blob([message.csv],{type:'text/csv;charset=utf-8'}));const link=el('a',{href:url,download:'sqywein-sifreler.csv'});document.body.append(link);link.click();link.remove();setTimeout(() => URL.revokeObjectURL(url),1000);});
document.getElementById('add-open').addEventListener('click',() => {addCard.hidden=false;document.querySelector('#add-form input').focus();});
document.getElementById('add-cancel').addEventListener('click',() => {document.getElementById('add-form').reset();addCard.hidden=true;document.getElementById('add-open').focus();});
document.getElementById('add-form').addEventListener('submit',event => {
  event.preventDefault();const data=new FormData(event.target);let url;
  try{url=new URL(data.get('url'));if(!['https:','http:'].includes(url.protocol))throw new Error();}catch{notify('http:// veya https:// ile başlayan bir site adresi yaz.');return;}
  send('passwords.add',{url:url.href,username:data.get('username'),password:data.get('password')});event.target.reset();addCard.hidden=true;document.getElementById('add-open').focus();
});
function secret(id,callback){
  if(requests.has(id))return;requests.set(id,callback);send('passwords.reveal',{id});
  setTimeout(() => {if(requests.get(id)===callback){requests.delete(id);notify('Şifre alınamadı. Yeniden dene.');}},60000);
}
on('passwords.denied',message => {requests.delete(message.id);notify('Kimlik doğrulanmadığı için şifre gösterilmedi.');});
on('passwords.reveal',message => {const callback=requests.get(message.id);requests.delete(message.id);if(callback && typeof message.password==='string')callback(message.password);});
async function copy(value){try{await navigator.clipboard.writeText(value);notify('Panoya kopyalandı.');}catch{notify('Panoya kopyalanamadı. Yeniden dene.');}}
function edit(item,info){
  if(info.querySelector('form'))return;
  secret(item.id,password => {
    if(!info.isConnected)return;
    const user=el('input',{type:'text',value:item.username,'aria-label':'Kullanıcı adı',autocomplete:'off'});
    const pass=el('input',{type:'password',value:password,'aria-label':'Şifre',autocomplete:'new-password',required:true});
    const form=el('form',{class:'edit-form',onsubmit:event => {event.preventDefault();send('passwords.update',{id:item.id,username:user.value,password:pass.value});pass.value='';}},user,pass,el('button',{type:'submit'},'Kaydet'),action('Vazgeç',render));
    form.addEventListener('keydown',event => {if(event.key==='Escape'){event.preventDefault();pass.value='';render();}});
    info.replaceChildren(form);user.focus();
  });
}
const open=new Set();
function siteIcon(site,icon){return icon?el('img',{class:'site-icon',src:icon,alt:'','aria-hidden':'true'}):badge(site);}
function accountRow(item,site){
  const masked=el('span',{class:'password-value'},'••••••••');let shown=false,revealTimer;
  const hide=() => {shown=false;masked.textContent='••••••••';reveal.setAttribute('aria-label','Şifreyi göster');reveal.title='Şifreyi göster';reveal.setAttribute('aria-pressed','false');clearTimeout(revealTimer);};
  const reveal=action('Şifreyi göster',() => {if(shown){hide();return;}secret(item.id,password => {if(!masked.isConnected)return;shown=true;masked.textContent=password;reveal.title='Şifreyi gizle';reveal.setAttribute('aria-label','Şifreyi gizle');reveal.setAttribute('aria-pressed','true');revealTimer=setTimeout(hide,30000);});},'eye',{'aria-pressed':'false'});
  const info=el('div',{class:'row-main'},el('div',{class:'title'},item.username || 'Kullanıcı adı yok'),el('div',{class:'password-secret'},masked,reveal));
  if(item.lastUsed)info.append(el('div',{class:'detail'},'Son kullanım: '+(dateValue(item.lastUsed)?.toLocaleDateString('tr-TR') || item.lastUsed)));
  const remove=action('Şifreyi sil',event => confirmInline(event.currentTarget,`${site} için kayıtlı şifre silinsin mi?`,() => send('passwords.remove',{id:item.id})),'delete');
  const actions=el('div',{class:'actions'},action('Kullanıcı adını kopyala',() => copy(item.username),'copy'),action('Şifreyi kopyala',() => secret(item.id,copy),'password'),action('Düzenle',() => edit(item,info),'edit'),remove);
  return el('div',{class:'row account-row','data-key':item.id,role:'listitem'},info,actions);
}
function render(){
  const restore=rememberFocus(results);requests.clear();results.replaceChildren();results.setAttribute('aria-busy','false');
  if(!items.length){empty(results,search.value?'Sonuç bulunamadı':'Şifrelerin için bir yer hazır',search.value?'Başka bir site veya kullanıcı adı dene.':'Google’dan içe aktar ya da ilk şifreni ekle.');if(!search.value)results.firstChild.append(action("Google'dan içe aktar",openImport));restore();return;}
  // Google Şifre Yöneticisi gibi: tek liste, her satır bir site; tıklayınca hesaplar açılır.
  const groups=new Map();for(const item of items){const site=host(item.origin).replace(/^www\./,'');if(!groups.has(site))groups.set(site,[]);groups.get(site).push(item);}
  results.append(el('div',{class:'list-head'},el('h2',{},'Şifreler'),el('span',{class:'detail'},`${items.length} hesap · ${groups.size} site`)));
  const list=el('div',{class:'card list site-list',role:'list'});results.append(list);
  for(const [site,credentials] of groups){
    const expanded=open.has(site)||(search.value&&groups.size<=3);
    const count=credentials.length>1?el('span',{class:'count'},`${credentials.length} hesap`):null;
    const head=el('button',{type:'button',class:'site-row','aria-expanded':String(expanded),onclick:() => {if(open.has(site))open.delete(site);else open.add(site);render();}},
      siteIcon(site,credentials.find(c => c.icon)?.icon),el('span',{class:'site-name'},credentials[0].origin.startsWith('http://')?credentials[0].origin:site),count,el('span',{class:'chevron icon','aria-hidden':'true'},expanded?'':''));
    const group=el('div',{class:'site-group',role:'listitem'},head);
    if(expanded){const accounts=el('div',{class:'site-accounts',role:'list'});for(const item of credentials)accounts.append(accountRow(item,site));group.append(accounts);}
    list.append(group);
  }restore();
}
on('passwords.error',message=>{results.setAttribute('aria-busy','false');results.replaceChildren(el('p',{role:'alert'},message.message||'Şifre kasasına erişilemedi.'));});
on('passwords.list',message => {items=message.items || [];render();});
search.addEventListener('input',debounce(() => {results.setAttribute('aria-busy','true');send('passwords.list',{query:search.value});}));
document.addEventListener('visibilitychange',() => {if(document.hidden){document.querySelectorAll('.password-value').forEach(node => {node.textContent='••••••••';});requests.clear();render();}});
send('passwords.list',{query:''});
</script></body></html>
