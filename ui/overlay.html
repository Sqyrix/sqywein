<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Sqywein · Hızlı erişim</title><link rel="stylesheet" href="/app.css"><script src="/app.js"></script>
<script>if(window.__sqGlass)document.documentElement.classList.add("glass");if(window.__sqMotion===false)document.documentElement.classList.add("reduce-motion");</script><style>
.glass body{background:color-mix(in srgb,var(--raised) 88%,transparent)}.reduce-motion .surface{animation:none}body{margin:0;background:var(--raised);min-width:0} .surface{height:100dvh;display:flex;flex-direction:column;padding:18px;gap:14px;box-sizing:border-box}.surface header{display:flex;align-items:center;gap:12px}.surface h1{font-size:18px;margin:0;flex:1}.surface input{width:100%;box-sizing:border-box;font-size:18px;padding:14px 16px;background:var(--field);border:1px solid var(--line);border-radius:12px}.surface button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.surface #results{overflow:auto;flex:1;min-height:0;padding:3px}.result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;border-radius:9px;margin-bottom:3px}.result:hover,.result[aria-selected=true]{background:var(--hover)}.result .info{flex:1;min-width:0}.result strong,.result small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result small{color:var(--muted);margin-top:3px}.result .kind{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start}.tile{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}.tile[aria-current=true]{border-color:var(--accent)}.tile .thumbnail{height:132px;width:100%;object-fit:cover;object-position:top;background:var(--hover)}.tile .placeholder{height:132px;display:grid;place-items:center;color:var(--muted);font-size:13px}.tile .caption{padding:10px;width:100%;min-width:0;box-sizing:border-box}.tile strong,.tile small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile small{color:var(--muted);font-size:12px;margin-top:4px}.preview-image{max-width:100%;max-height:calc(100dvh - 140px);display:block;object-fit:contain;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 Consolas,monospace;margin:0;color:var(--ink)}footer{font-size:12px;color:var(--muted)}#copy[hidden],#query[hidden]{display:none}@media(prefers-reduced-motion:no-preference){.surface{animation:arrive 160ms cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{opacity:.7;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body><main class="surface"><header><h1 id="heading">Hızlı erişim</h1><button id="copy" type="button" hidden>Metni kopyala</button><button id="close" type="button" aria-label="Paneli kapat">Esc</button></header><label id="query-label" class="sr-only" for="query">Sekmelerde, geçmişte ve yer işaretlerinde ara</label><input id="query" type="search" autocomplete="off" placeholder="Sekme, geçmiş, yer işareti veya komut ara…"><div id="results" aria-live="polite"><p role="status">Yükleniyor…</p></div><footer id="hint">↑ ↓ Seç · Enter Aç · Esc Kapat</footer></main>
<script>
'use strict';
const mode=location.hash.slice(1),query=document.getElementById('query'),results=document.getElementById('results');
const heading=document.getElementById('heading');let data=null,index=0,timer=0,generation=0;const thumbs=new Map(),thumbsDone=new Set();
heading.textContent=({spotlight:'Hızlı erişim',tabs:'Sekmelere genel bakış',download:'Hızlı Bakış',text:'Canlı Metin',notice:'Bilgi'})[mode]||'Hızlı erişim';
query.hidden=!['spotlight','tabs'].includes(mode);document.getElementById('hint').hidden=query.hidden;
if(mode==='tabs'){query.placeholder='Sekmeleri filtrele…';results.className='grid';}
const commands=[['settings','Ayarlar'],['downloads','İndirmeler'],['history','Geçmiş'],['bookmarks','Yer işaretleri'],['focus','Odak modunu değiştir'],['translate','Sayfa çevirisini değiştir'],['share','Sayfayı paylaş'],['pip','Görüntü içinde görüntü'],['new','Yeni sekme']];
function close(){send('overlay.close');}document.getElementById('close').onclick=close;
document.getElementById('copy').onclick=()=>send('overlay.copy');
on('overlay.copy',d=>{document.getElementById('copy').textContent=d.ok?'Kopyalandı':'Pano meşgul; yeniden dene';});
function choices(){return [...results.querySelectorAll('button')];}
function select(n){const buttons=choices();index=Math.max(0,Math.min(n,buttons.length-1));buttons.forEach((b,i)=>b.setAttribute('aria-selected',String(i===index)));buttons[index]?.scrollIntoView({block:'nearest'});}
function open(item){if(item.id!==undefined)send('overlay.activate',{id:item.id});else if(item.command)send('overlay.command',{command:item.command});else send('overlay.open',{url:item.url});}
function row(item,kind){const b=el('button',{type:'button',class:'result',onclick:()=>open(item)},el('span',{class:'info'},el('strong',{},item.title||item.url),el('small',{},item.url||'Sqywein')),el('span',{class:'kind'},kind));return b;}
function render(){
 if(!data)return;results.replaceChildren();const q=query.value.toLocaleLowerCase('tr-TR');const match=i=>(String(i.title)+' '+String(i.url)).toLocaleLowerCase('tr-TR').includes(q);
 if(mode==='tabs'){
  for(const tab of (data.tabs||[]).filter(match)){const button=el('button',{class:'tile',type:'button','data-id':tab.id,'aria-current':String(tab.active),onclick:()=>open(tab)});const thumbnail=thumbs.get(tab.id);button.append(thumbnail?el('img',{class:'thumbnail',src:thumbnail,alt:''}):el('div',{class:'placeholder'},tab.sleeping?'Belleği korumak için uyuyor':thumbsDone.has(tab.id)?'Önizleme alınamadı':'Önizleme hazırlanıyor'),el('div',{class:'caption'},el('strong',{},tab.title),el('small',{},host(tab.url)||'Yeni sekme')));results.append(button);}
 }else if(mode==='spotlight'){
  const seen=new Set();for(const [items,kind] of [[data.tabs||[],'Sekme'],[data.bookmarks||[],'Yer işareti'],[data.history||[],'Geçmiş']])for(const item of items.filter(match)){if(seen.has(item.url))continue;seen.add(item.url);results.append(row(item,kind));}
  for(const [command,title]of commands)if(title.toLocaleLowerCase('tr-TR').includes(q))results.append(row({command,title},'Komut'));
  if(q)results.append(row({title:'Ara veya adrese git',url:query.value},'Web'));
 }else if(mode==='download'){
  const p=data.preview||{};heading.textContent=p.name||'Hızlı Bakış';
  if(p.loading)results.append(el('p',{role:'status'},'Dosya önizlemesi hazırlanıyor…'));
  if(p.image)results.append(el('img',{class:'preview-image',src:p.image,alt:p.name||'Dosya önizlemesi'}));
  if(p.text!==undefined)results.append(el('pre',{},p.text));
  if(p.error)results.append(el('p',{role:'status'},p.error));
  document.getElementById('hint').hidden=false;document.getElementById('hint').textContent=(p.size?bytes(p.size)+' · ':'')+(p.note||'Dosya harici bir uygulamada açılmadı.');
 }else if(mode==='text'||mode==='notice'){
  results.append(el('pre',{},data.text||'Bu görüntüde okunabilir metin bulunamadı.'));document.getElementById('copy').hidden=mode!=='text'||!data.text;
 }
 if(!results.childNodes.length)results.append(el('p',{role:'status'},'Eşleşen sekme bulunamadı.'));index=0;if(!query.hidden)select(0);
}
on('overlay.get',d=>{if(d.query!==undefined&&d.query!==query.value.toLowerCase())return;data=d;render();});
on('overlay.preview',d=>{if(mode!=='download')return;data={...(data||{}),preview:d.preview};render();});
on('overlay.thumbnail',d=>{thumbsDone.add(d.id);if(d.image===''){const tile=[...results.querySelectorAll('[data-id]')].find(n=>n.dataset.id===String(d.id));const placeholder=tile?.querySelector('.placeholder');if(placeholder)placeholder.textContent='Önizleme alınamadı';return;}if(typeof d.image!=='string'||!d.image.startsWith('data:image/png;base64,'))return;thumbs.set(d.id,d.image);const tile=[...results.querySelectorAll('[data-id]')].find(n=>n.dataset.id===String(d.id));if(tile){const old=tile.querySelector('.placeholder,.thumbnail');old?.replaceWith(el('img',{class:'thumbnail',src:d.image,alt:''}));}});
query.addEventListener('input',()=>{clearTimeout(timer);render();if(mode==='tabs')return;const seq=++generation;timer=setTimeout(()=>{if(seq===generation)send('overlay.get',{query:query.value});},100);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();select(index+(e.key==='ArrowDown'?1:-1));}else if(e.key==='Enter'&&e.target===query){e.preventDefault();choices()[index]?.click();}});
send('overlay.get',{thumbnails:mode==='tabs'});if(!query.hidden)query.focus();
</script></body></html>
